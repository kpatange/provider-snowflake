apiVersion: grant.crossplane.io/v1alpha1
kind: DatabaseRole
metadata:
  annotations:
    meta.upbound.io/example-id: grant/v1alpha1/databaserole
  labels:
    testing.upbound.io/example-name: g
  name: g
spec:
  forProvider:
    databaseRoleName: '"${var.database}"."${snowflake_database_role.database_role.name}"'
    parentRoleName: role_name

---

apiVersion: snowflakeaccountrole.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: grant/v1alpha1/databaserole
  labels:
    testing.upbound.io/example-name: parent_role
  name: parent-role
spec:
  forProvider:
    name: ${var.parent_role_name}

---

apiVersion: snowflakedatabaserole.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: grant/v1alpha1/databaserole
  labels:
    testing.upbound.io/example-name: database_role
  name: database-role
spec:
  forProvider:
    database: ${var.database}
    name: ${var.database_role_name}

---

apiVersion: snowflakedatabaserole.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: grant/v1alpha1/databaserole
  labels:
    testing.upbound.io/example-name: parent_database_role
  name: parent-database-role
spec:
  forProvider:
    database: ${var.database}
    name: ${var.parent_database_role_name}
