apiVersion: user.crossplane.io/v1alpha1
kind: ProgrammaticAccessToken
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/programmaticaccesstoken
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    user: USER

---

apiVersion: snowflakeaccountrole.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/programmaticaccesstoken
  labels:
    testing.upbound.io/example-name: role
  name: role
spec:
  forProvider:
    name: ROLE

---

apiVersion: snowflakegrantaccountrole.crossplane.io/v1alpha1
kind: AccountRole
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/programmaticaccesstoken
  labels:
    testing.upbound.io/example-name: grant_role_to_user
  name: grant-role-to-user
spec:
  forProvider:
    roleName: ROLE
    userName: USER

---

apiVersion: snowflakeuser.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/programmaticaccesstoken
  labels:
    testing.upbound.io/example-name: user
  name: user
spec:
  forProvider:
    name: USER
